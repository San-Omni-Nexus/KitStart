<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest">
  <title>KitStart</title>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d3a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ks" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5e0fd"/>
      <stop offset="1" stop-color="#5aa2f5"/>
    </linearGradient>
    <!-- K and S as outlines, so no font is needed -->
    <g id="ksShape" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 28V72M24 51 43 28M27 50 46 72"/>
      <path d="M79 36C72 27 56 29 56 39 56 49 79 50 79 61 79 72 62 74 54 65"/>
    </g>
  </defs>

  <!-- hides hairline seams between faces -->
  <path d="M64 10 111 37V91L64 118 17 91V37Z" fill="#3b82f6"/>

  <!-- left face -->
  <path d="M17 37 64 64V118L17 91Z" fill="url(#left)"/>
  <!-- right face -->
  <path d="M64 64 111 37V91L64 118Z" fill="url(#right)"/>
  <!-- top face -->
  <path d="M64 10 111 37 64 64 17 37Z" fill="url(#top)"/>

  <!-- embossed KS on the left face: shadow, highlight, then the raised letters -->
  <g transform="matrix(0.47 0.27 0 0.54 17 37)">
    <use href="#ksShape" stroke="#1e3a8a" stroke-opacity=".55" transform="translate(2 2.5)"/>
    <use href="#ksShape" stroke="#e0f7ff" stroke-opacity=".8" transform="translate(-1.5 -2)"/>
    <use href="#ksShape" stroke="url(#ks)"/>
  </g>

  <!-- black start mark on the right face, with a faint light rim for contrast -->
  <g transform="matrix(0.47 -0.27 0 0.54 64 64)">
    <path d="M32 24 78 50 32 76Z" fill="#c7d2fe" fill-opacity=".45" stroke="#c7d2fe" stroke-opacity=".45" stroke-width="6" stroke-linejoin="round" transform="translate(1.5 2)"/>
    <path d="M32 24 78 50 32 76Z" fill="url(#mark)" stroke="url(#mark)" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- soft light on the edges for depth -->
  <path d="M17 37 64 10 111 37" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M17 37 64 64 111 37" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M64 64V118" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.2" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
